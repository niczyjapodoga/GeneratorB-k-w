<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kansino Offline 🎰 PRO CHAOS</title>
  <style>
    :root{
      --gold:#ffd700;
      --red:#ff2e2e;
      --pink:#ff4fd8;
      --blue:#4cc9f0;
      --green:#00ff7f;
      --bg1:#090909;
      --bg2:#1f1f1f;
      --bg3:#2f2f2f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
      font-family: Impact, Haettenschweiler, 'Arial Black', sans-serif;
      background: radial-gradient(circle at top, #333 0%, #111 45%, #050505 100%);
      animation: bgPulse 6s infinite alternate ease-in-out;
    }

    body.spin-chaos {
      animation: bgPulse 0.5s infinite alternate ease-in-out;
    }

    body.ultra-mode {
      animation: ultraBg 0.25s infinite linear;
    }

    @keyframes bgPulse {
      0% { filter: hue-rotate(0deg) saturate(1); }
      100% { filter: hue-rotate(20deg) saturate(1.3); }
    }

    @keyframes ultraBg {
      0% { filter: hue-rotate(0deg) brightness(1); }
      20% { filter: hue-rotate(70deg) brightness(1.2); }
      40% { filter: hue-rotate(140deg) brightness(1.5); }
      60% { filter: hue-rotate(210deg) brightness(1.1); }
      80% { filter: hue-rotate(280deg) brightness(1.4); }
      100% { filter: hue-rotate(360deg) brightness(1); }
    }

    .wrap {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 5rem);
      letter-spacing: 2px;
      color: var(--gold);
      text-shadow:
        0 0 10px #ff0000,
        0 0 30px #ff0000,
        0 0 50px #ff8800;
      animation: titleFlicker 1.7s infinite alternate;
      user-select: none;
    }

    @keyframes titleFlicker {
      0% { transform: scale(1); filter: drop-shadow(0 0 8px #ff0000); }
      100% { transform: scale(1.03) rotate(-0.5deg); filter: drop-shadow(0 0 22px #ffff00); }
    }

    .slot-machine {
      position: relative;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 24px;
      border-radius: 26px;
      background:
        linear-gradient(145deg, rgba(80,80,80,.95), rgba(20,20,20,.95));
      border: 8px solid #666;
      box-shadow:
        0 0 0 4px rgba(255,255,255,.05) inset,
        0 0 20px rgba(255,215,0,.25),
        0 20px 80px rgba(0,0,0,.6);
      transform: perspective(1000px) rotateX(4deg);
    }

    .slot-machine::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 18px;
      border: 2px dashed rgba(255,255,255,.08);
      pointer-events: none;
    }

    .reels {
      display: flex;
      gap: 18px;
      padding: 10px;
    }

    .reel {
      width: min(18vw, 128px);
      height: min(18vw, 128px);
      min-width: 96px;
      min-height: 96px;
      background: linear-gradient(180deg, #000, #1a1a1a);
      border: 5px solid #bcbcbc;
      border-radius: 16px;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
      box-shadow:
        0 0 0 3px rgba(255,255,255,.05) inset,
        0 0 20px rgba(0,0,0,.8);
    }

    .reel.spinning {
      box-shadow:
        0 0 0 3px rgba(255,255,255,.05) inset,
        0 0 28px rgba(255,255,255,.35),
        0 0 45px rgba(255,215,0,.35);
      animation: reelShake .12s infinite linear;
    }

    @keyframes reelShake {
      0%   { transform: translateY(0px) scale(1); }
      25%  { transform: translateY(-1px) scale(1.01); }
      50%  { transform: translateY(1px) scale(1); }
      75%  { transform: translateY(-1px) scale(1.01); }
      100% { transform: translateY(0px) scale(1); }
    }

    .reel img {
      width: 90%;
      height: 90%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
      image-rendering: auto;
      filter: drop-shadow(0 0 4px rgba(255,255,255,.15));
      transition: transform .12s ease;
    }

    .lever {
      width: 20px;
      height: 160px;
      background: linear-gradient(180deg, #ff3b3b, #b10000);
      border: 3px solid #fff;
      border-radius: 999px;
      position: absolute;
      right: -42px;
      top: 26px;
      cursor: pointer;
      transform-origin: top center;
      transition: transform 0.25s ease;
      user-select: none;
      box-shadow: 0 0 18px rgba(255,0,0,.5);
    }

    .lever::after {
      content: "";
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff, #ff2e2e 50%, #8b0000 100%);
      border: 3px solid #fff;
      box-shadow: 0 0 16px rgba(255,0,0,.6);
    }

    .lever:active {
      transform: rotate(50deg);
    }

    .panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      user-select: none;
    }

    #budget {
      font-size: clamp(1.3rem, 3vw, 2.1rem);
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,.2);
    }

    #bet-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    button {
      padding: 12px 18px;
      background: linear-gradient(180deg, #ff4f8b, #e8006a);
      border: none;
      border-radius: 999px;
      font-size: 1.1rem;
      color: #fff;
      cursor: pointer;
      user-select: none;
      box-shadow:
        0 6px 0 rgba(0,0,0,.25),
        0 0 18px rgba(255,79,139,.2);
      transform: translateY(0);
      transition: transform .08s ease, filter .2s ease, opacity .2s ease;
    }

    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(3px); }

    button:disabled {
      background: #555;
      cursor: not-allowed;
      opacity: .6;
      box-shadow: none;
    }

    #bet-controls .small-btn {
      background: linear-gradient(180deg, #38bdf8, #1d4ed8);
    }

    #spinButton {
      font-size: 1.6rem;
      padding: 14px 28px;
      background: linear-gradient(180deg, #00ff88, #00a65a);
      color: #031b0f;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow:
        0 10px 0 rgba(0,0,0,.24),
        0 0 25px rgba(0,255,140,.25);
    }

    #spinButton:disabled {
      background: #4b4b4b;
      color: #ddd;
    }

    .message {
      font-size: clamp(1.4rem, 4vw, 3rem);
      color: #ffeb3b;
      text-shadow: 0 0 16px #ff0000, 0 0 28px #ff8800;
      min-height: 1.5em;
      display: none;
      animation: messagePop .25s ease;
      user-select: none;
    }

    @keyframes messagePop {
      from { transform: scale(.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .laughing-face {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 96px;
      height: 96px;
      z-index: 30;
      filter: drop-shadow(0 0 12px rgba(255,0,0,.8));
      animation: bob 1.4s infinite ease-in-out;
    }

    .laughing-face img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255,255,255,.7);
      box-shadow: 0 0 20px #f00;
    }

    @keyframes bob {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(4deg); }
    }

    /* WIN overlays */
    .overlay-win {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 500;
      pointer-events: none;
      text-align: center;
    }

    .overlay-win .label {
      font-size: clamp(3rem, 7vw, 7rem);
      line-height: 0.95;
      text-shadow: 0 0 15px rgba(255,255,255,.5);
      filter: drop-shadow(0 0 20px rgba(0,0,0,.5));
    }

    .overlay-win img {
      margin-top: 14px;
      max-width: min(40vw, 300px);
      max-height: 34vh;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255,255,255,.2);
    }

    .small-win {
      color: #ffff66;
      animation: smallWinPulse .7s infinite alternate;
    }

    .big-win {
      color: #00e5ff;
      animation: bigWinPulse .45s infinite alternate;
    }

    .ultra-win {
      color: #ff3b3b;
      animation: ultraWinPulse .18s infinite alternate;
    }

    @keyframes smallWinPulse {
      from { transform: scale(1); text-shadow: 0 0 8px #ff0; }
      to { transform: scale(1.06); text-shadow: 0 0 22px #ff0, 0 0 40px #f00; }
    }

    @keyframes bigWinPulse {
      from { transform: scale(1); filter: hue-rotate(0deg); }
      to { transform: scale(1.15) rotate(-1deg); filter: hue-rotate(25deg); }
    }

    @keyframes ultraWinPulse {
      from { transform: scale(1) rotate(0deg); }
      to { transform: scale(1.2) rotate(2deg); }
    }

    /* train */
    .train {
      position: fixed;
      left: -420px;
      bottom: 10%;
      z-index: 650;
      font-size: clamp(3rem, 7vw, 6rem);
      white-space: nowrap;
      text-shadow: 0 0 12px #fff, 0 0 25px #ff0;
      pointer-events: none;
      display: none;
      user-select: none;
    }

    .train.run {
      display: block;
      animation: trainRide 3.2s linear forwards;
    }

    @keyframes trainRide {
      0%   { transform: translateX(0) scale(1); }
      50%  { transform: translateX(55vw) scale(1.02); }
      100% { transform: translateX(130vw) scale(1); }
    }

    /* clown */
    .clown-burst {
      position: fixed;
      left: 50%;
      top: 16%;
      transform: translateX(-50%);
      z-index: 620;
      font-size: clamp(4rem, 10vw, 8rem);
      display: none;
      pointer-events: none;
      user-select: none;
      text-shadow: 0 0 15px #ff00ff, 0 0 30px #ff0000;
    }

    .clown-burst.run {
      display: block;
      animation: clownPop 1.1s ease-in-out;
    }

    @keyframes clownPop {
      0% { transform: translateX(-50%) scale(.3) rotate(-20deg); opacity: 0; }
      20% { transform: translateX(-50%) scale(1.2) rotate(8deg); opacity: 1; }
      50% { transform: translateX(-50%) scale(1) rotate(-6deg); }
      100% { transform: translateX(-50%) scale(1.05) rotate(0deg); opacity: 0; }
    }

    /* flash */
    .flash {
      position: fixed;
      inset: 0;
      background: white;
      opacity: 0;
      z-index: 400;
      pointer-events: none;
    }

    .flash.on {
      animation: flashAnim .35s ease;
    }

    @keyframes flashAnim {
      0% { opacity: 0; }
      20% { opacity: .75; }
      100% { opacity: 0; }
    }

    /* screen shake */
    body.shake {
      animation: shake .25s linear infinite;
    }

    @keyframes shake {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-3px, 2px) rotate(-0.2deg); }
      40% { transform: translate(3px, -2px) rotate(0.2deg); }
      60% { transform: translate(-2px, -3px) rotate(-0.15deg); }
      80% { transform: translate(2px, 3px) rotate(0.15deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    /* coin / confetti layer */
    #fx-layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 450;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      top: -10vh;
      font-size: 1.4rem;
      user-select: none;
      will-change: transform, opacity;
      animation: fall linear forwards;
      text-shadow: 0 0 8px rgba(255,255,255,.3);
    }

    @keyframes fall {
      0%   { transform: translateY(-10vh) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(115vh) rotate(720deg) scale(1.2); opacity: 0; }
    }

    .banner-top {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      font-size: .95rem;
      color: #ffd;
      opacity: .8;
      text-shadow: 0 0 10px #000;
      user-select: none;
      white-space: nowrap;
    }

    .glitch-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 60;
      mix-blend-mode: screen;
      opacity: .12;
      background:
        repeating-linear-gradient(
          180deg,
          rgba(255,255,255,.15) 0px,
          rgba(255,255,255,.15) 2px,
          transparent 2px,
          transparent 6px
        );
      animation: glitchMove .7s infinite linear;
    }

    @keyframes glitchMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(6px); }
    }

    /* mobile */
    @media (max-width: 700px) {
      .slot-machine {
        transform: none;
        padding: 16px;
        gap: 10px;
      }
      .reels {
        gap: 10px;
        padding: 0;
      }
      .lever {
        right: -34px;
        top: 20px;
      }
      .laughing-face {
        width: 72px;
        height: 72px;
      }
    }
  </style>
</head>
<body>
  <div class="glitch-lines"></div>
  <div class="flash" id="flash"></div>
  <div id="fx-layer"></div>

  <div class="banner-top">KANSINO OFFLINE PRO — CHAOS MODE — BIG WIN / ULTRA WIN / TRAIN / CLOWN</div>

  <div class="wrap">
    <h1>KANSINO OFFLINE 🎰 PRO CHAOS</h1>

    <div class="slot-machine" id="slotMachine">
      <div class="reels">
        <div class="reel"><img src="chatgpt.png" alt="slot1" /></div>
        <div class="reel"><img src="chomikchinczyk.jpg" alt="slot2" /></div>
        <div class="reel"><img src="chomiczek.png" alt="slot3" /></div>
      </div>
      <div class="lever" onclick="pullLever()" title="Pociągnij dźwignię"></div>
    </div>

    <div class="panel">
      <div id="budget">Budżet: <span id="budget-amount">500</span> 💰</div>

      <div id="bet-controls">
        <button class="small-btn" onclick="changeBet(-10)">-10</button>
        <div>Obstaw: <span id="bet-amount">50</span> 💰</div>
        <button class="small-btn" onclick="changeBet(10)">+10</button>
        <button class="small-btn" onclick="fullBet()" title="Obstaw wszystko!">FULL BET</button>
      </div>

      <button id="spinButton" onclick="spin()">KRĘĆ!</button>
      <div class="message" id="message"></div>
    </div>
  </div>

  <div class="laughing-face">
    <img src="chomiczek.png" alt="hahaha" />
  </div>

  <div id="small-win" class="overlay-win small-win" style="display:none;">
    <div class="label">WIN ✨</div>
    <div style="font-size:1.5rem; margin-top:8px;">coś drgnęło...</div>
  </div>

  <div id="big-win" class="overlay-win big-win" style="display:none;">
    <div class="label">BIG WIN 💥</div>
    <img src="Zrzut ekranu 2025-05-23 200140.png" alt="big win" />
  </div>

  <div id="ultra-win" class="overlay-win ultra-win" style="display:none;">
    <div class="label">ULTRA WIN 🚀🔥</div>
    <img src="Zrzut ekranu 2025-05-25 131156.png" alt="ultra win" />
  </div>

  <div id="train" class="train">🚂💨💨💨 KASINO POCIĄG 💨💨💨🚂</div>
  <div id="clown" class="clown-burst">🤡🤡🤡</div>

  <script>
    const images = [
      "Zrzut ekranu 2025-06-01 164255.png",
      "chomikchinczyk.jpg",
      "chomiczek.png",
      "Zrzut ekranu 2025-05-26 221805.png",
      "ChatGPT Image 27 kwi 2025, 16_15_08.png"
    ];

    let cooldown = false;
    let budget = 500;
    let bet = 50;

    const reelsImgs = document.querySelectorAll('.reel img');
    const reels = document.querySelectorAll('.reel');
    const message = document.getElementById("message");
    const spinButton = document.getElementById("spinButton");
    const budgetDisplay = document.getElementById("budget-amount");
    const betDisplay = document.getElementById("bet-amount");
    const fxLayer = document.getElementById("fx-layer");
    const flash = document.getElementById("flash");

    const smallWinDiv = document.getElementById("small-win");
    const bigWinDiv = document.getElementById("big-win");
    const ultraWinDiv = document.getElementById("ultra-win");
    const trainDiv = document.getElementById("train");
    const clownDiv = document.getElementById("clown");

    function fileNameFromSrc(src) {
      return decodeURIComponent(src.split('/').pop().split('?')[0]);
    }

    function randItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function showMessage(text, time = 1800) {
      message.textContent = text;
      message.style.display = "block";
      clearTimeout(showMessage._t);
      showMessage._t = setTimeout(() => {
        message.style.display = "none";
      }, time);
    }

    function updateBudget() {
      budgetDisplay.textContent = budget;

      if (budget < 10) {
        bet = 0;
      } else {
        if (bet < 10) bet = 10;
        if (bet > budget) bet = budget;
      }

      betDisplay.textContent = bet;
      spinButton.disabled = cooldown || bet > budget || bet < 10;
    }

    function changeBet(amount) {
      if (cooldown) return;

      if (budget < 10) {
        bet = 0;
      } else {
        bet += amount;
        if (bet < 10) bet = 10;
        if (bet > budget) bet = budget;
      }
      updateBudget();
      triggerMicroChaos();
    }

    function fullBet() {
      if (cooldown) return;
      bet = budget >= 10 ? budget : 0;
      updateBudget();
      triggerMicroChaos();
    }

    function pullLever() {
      if (cooldown) return;
      const lever = document.querySelector('.lever');
      lever.style.transform = 'rotate(50deg)';
      setTimeout(() => {
        lever.style.transform = 'rotate(0deg)';
      }, 240);
    }

    function flashScreen() {
      flash.classList.remove("on");
      void flash.offsetWidth;
      flash.classList.add("on");
      setTimeout(() => flash.classList.remove("on"), 350);
    }

    function shakeBody(ms = 300) {
      document.body.classList.add("shake");
      setTimeout(() => document.body.classList.remove("shake"), ms);
    }

    function spawnParticles(count = 24, mode = "coin") {
      const icons = mode === "ultra"
        ? ["💰", "✨", "🎆", "💥", "⭐", "🔥"]
        : mode === "big"
          ? ["💸", "💥", "✨", "🪙", "🎊"]
          : ["🪙", "✨", "🎉", "💫"];

      for (let i = 0; i < count; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.textContent = randItem(icons);
        p.style.left = Math.random() * 100 + "vw";
        p.style.fontSize = (Math.random() * 1.2 + 1) + "rem";
        p.style.animationDuration = (Math.random() * 1.8 + 1.2) + "s";
        p.style.animationDelay = (Math.random() * 0.15) + "s";
        p.style.transform = `translateY(-10vh) rotate(${Math.random() * 360}deg)`;
        fxLayer.appendChild(p);

        setTimeout(() => p.remove(), 3500);
      }
    }

    function clownBurst() {
      clownDiv.classList.remove("run");
      void clownDiv.offsetWidth;
      clownDiv.classList.add("run");
      setTimeout(() => clownDiv.classList.remove("run"), 1150);
    }

    function trainPass() {
      trainDiv.classList.remove("run");
      void trainDiv.offsetWidth;
      trainDiv.classList.add("run");
      setTimeout(() => trainDiv.classList.remove("run"), 3300);
    }

    function triggerMicroChaos() {
      flashScreen();
      shakeBody(160);
      spawnParticles(10, "coin");
      if (Math.random() < 0.35) clownBurst();
    }

    function showSmallWin() {
      smallWinDiv.style.display = "flex";
      spawnParticles(18, "small");
      flashScreen();
      shakeBody(260);
      setTimeout(() => {
        smallWinDiv.style.display = "none";
      }, 1200);
    }

    function showBigWin() {
      bigWinDiv.style.display = "flex";
      document.body.classList.add("spin-chaos");
      spawnParticles(40, "big");
      flashScreen();
      shakeBody(550);
      clownBurst();
      setTimeout(() => {
        bigWinDiv.style.display = "none";
        document.body.classList.remove("spin-chaos");
      }, 2200);
    }

    function showUltraWin() {
      ultraWinDiv.style.display = "flex";
      document.body.classList.add("ultra-mode");
      spawnParticles(80, "ultra");
      flashScreen();
      shakeBody(900);
      clownBurst();
      trainPass();

      setTimeout(() => {
        ultraWinDiv.style.display = "none";
        document.body.classList.remove("ultra-mode");
      }, 3800);
    }

    function showLossChaos() {
      spawnParticles(8, "coin");
      if (Math.random() < 0.6) clownBurst();
      if (Math.random() < 0.3) trainPass();
      flashScreen();
      shakeBody(180);
    }

    function detectOutcome() {
      const names = [...reelsImgs].map(img => fileNameFromSrc(img.src));
      const counts = {};
      for (const n of names) counts[n] = (counts[n] || 0) + 1;

      const values = Object.values(counts);
      const maxCount = Math.max(...values);

      if (maxCount >= 3) {
        return { type: "ultra", symbol: Object.keys(counts).find(k => counts[k] === 3) };
      }
      if (maxCount >= 2) {
        return { type: "big", symbol: Object.keys(counts).find(k => counts[k] >= 2) };
      }
      return { type: "loss", symbol: null };
    }

    async function spin() {
      if (cooldown || bet > budget || bet < 10) return;

      cooldown = true;
      spinButton.disabled = true;
      message.style.display = "none";
      document.body.classList.add("spin-chaos");

      // pobranie stawki
      budget -= bet;
      updateBudget();

      pullLever();
      triggerMicroChaos();

      const durations = [1500, 2400, 3400];
      const intervalMs = 90;
      const intervals = [];

      reels.forEach((reel) => reel.classList.add("spinning"));

      for (let i = 0; i < 3; i++) {
        intervals[i] = setInterval(() => {
          reelsImgs[i].src = randItem(images);
        }, intervalMs);
      }

      await new Promise(r => setTimeout(r, durations[0]));
      clearInterval(intervals[0]);
      reelsImgs[0].src = randItem(images);

      await new Promise(r => setTimeout(r, durations[1] - durations[0]));
      clearInterval(intervals[1]);
      reelsImgs[1].src = randItem(images);

      await new Promise(r => setTimeout(r, durations[2] - durations[1]));
      clearInterval(intervals[2]);
      reelsImgs[2].src = randItem(images);

      reels.forEach((reel) => reel.classList.remove("spinning"));

      const outcome = detectOutcome();

      if (outcome.type === "ultra") {
        const winnings = bet * 20;
        budget += winnings;
        updateBudget();
        showMessage(`ULTRA WIN! +${winnings}💰`, 1800);
        showUltraWin();
        spawnParticles(100, "ultra");
      } else if (outcome.type === "big") {
        const winnings = bet * 6;
        budget += winnings;
        updateBudget();
        showMessage(`BIG WIN! +${winnings}💰`, 1500);
        showBigWin();
      } else {
        showMessage("Przegrana... ale chaos trwa dalej 🤡", 1700);
        showLossChaos();
      }

      cooldown = false;
      document.body.classList.remove("spin-chaos");
      updateBudget();
    }

    updateBudget();
    showMessage("Gotowy na chaos? Kliknij KRĘĆ!", 2000);
  </script>
</body>
</html>
